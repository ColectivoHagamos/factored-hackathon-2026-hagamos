# Production on the demo server: the API image from GHCR behind Caddy, which obtains and renews the certificate.
# Run by deploy/deploy.sh from /opt/vera, where .env (secrets) and data/demo.duckdb (read-only) live.
# The compose project ("vera", from the folder) touches nothing else on the host; Caddy owns ports 80 and 443.
services:
  api:
    image: ghcr.io/hagamoses/vera-api:${VERA_IMAGE_TAG:?set VERA_IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    environment:
      VERA_ADAPTER: dataset
      # The learned classifier reads the opening claim; docs/evaluation compares it with the keyword baseline.
      # The server's .env may choose anthropic once its LLM_API_KEY is set (P41).
      VERA_LLM: ${VERA_LLM:-classifier}
      VERA_DEMO_DB: /data/demo.duckdb
      VERA_STATE_DB: /state/state.sqlite
      VERA_VERSION: ${VERA_IMAGE_TAG}
    volumes:
      - ./data/demo.duckdb:/data/demo.duckdb:ro
      - vera_state:/state
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    # Measured: about 155 MB idle and 170 MB after ten conversations. On a shared server with little free memory,
    # VERA is the first process the kernel stops, never the stacks it shares the server with.
    mem_limit: 300m
    oom_score_adj: 500

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # 80 only redirects to https and answers the certificate challenge.
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    mem_limit: 64m
    oom_score_adj: 500

volumes:
  vera_state:
  caddy_data:
  caddy_config:
