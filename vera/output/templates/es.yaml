# Customer-facing replies in Spanish, in the voice of the brand: serene, warm and precise, never cold and never
# effusive. Plain language, one question per turn, no promises, no blame. VERA always says it is an AI.
# VERA speaks to the person, not about people in general, and never repeats what the customer just said or chose.
# {placeholders} in braces are filled by code; register words change with the variant: tu (MX), usted (CO), vos (AR).
# A list holds variants of the same reply, so the customer never gets the same words twice in a row.
register:
  es-MX: {puedes: puedes, tienes: tienes, quieres: quieres, reconoces: reconoces, confirmas: confirmas, cuentas: cuentas, dices: dices, tu: tu, tus: tus, te: te, contigo: contigo, usa: usa, elige: elige, escribe: escribe, has: has, sabes: sabes, estas: estás, dijiste: dijiste, tuyos: tuyos, llama: llama, activa: activa, compartas: compartas, revisa: revisa, quieras: quieras, prefieres: prefieres, dimelo: dímelo, cuentame: cuéntame, perdiste: perdiste, marca: marca, necesitas: necesitas, escribeme: escríbeme, tuya: tuya, aqui: aquí}
  es-CO: {puedes: puede, tienes: tiene, quieres: quiere, reconoces: reconoce, confirmas: confirma, cuentas: cuenta, dices: dice, tu: su, tus: sus, te: le, contigo: con usted, usa: use, elige: elija, escribe: escriba, has: ha, sabes: sabe, estas: está, dijiste: dijo, tuyos: suyos, llama: llame, activa: active, compartas: comparta, revisa: revise, quieras: quiera, prefieres: prefiere, dimelo: dígamelo, cuentame: cuénteme, perdiste: perdió, marca: marque, necesitas: necesita, escribeme: escríbame, tuya: suya, aqui: aquí}
  es-AR: {puedes: podés, tienes: tenés, quieres: querés, reconoces: reconocés, confirmas: confirmás, cuentas: contás, dices: decís, tu: tu, tus: tus, te: te, contigo: con vos, usa: usá, elige: elegí, escribe: escribí, has: has, sabes: sabés, estas: estás, dijiste: dijiste, tuyos: tuyos, llama: llamá, activa: activá, compartas: compartas, revisa: revisá, quieras: quieras, prefieres: preferís, dimelo: decímelo, cuentame: contame, perdiste: perdiste, marca: marcá, necesitas: necesitás, escribeme: escribime, tuya: tuya, aqui: acá}

templates:
  greeting: "Hola{who}, soy VERA, la asistente de inteligencia artificial de LATAM Bank. Estoy {aqui} para acompañar{te}. ¿Qué pasó con {tu} tarjeta o {tu} cuenta? {Puedes} elegir una opción o contármelo con {tus} palabras; si en algún momento {prefieres} hablar con una persona, solo {dimelo}."
  welcome:
    - "Hola, gracias por escribirme. Soy VERA y {te} acompaño cuando aparece un cargo que no {reconoces}, un cobro que no corresponde, una tarjeta perdida o robada, o una transferencia en la que {te} engañaron. ¿Por dónde empezamos?"
    - "{Aqui} estoy para ayudar{te}, paso a paso. {Cuentame} con {tus} palabras qué pasó, o {elige} la opción que más se parece."
    - "Sigo {contigo}. Con una de estas opciones lo resolvemos más rápido, o {escribeme} qué pasó y lo vemos juntos."
  menu_unrecognized: "No reconozco un cargo"
  menu_improper: "Me cobraron algo que no corresponde"
  menu_lost_card: "Perdí mi tarjeta o me la robaron"
  menu_scam: "Me engañaron para hacer una transferencia"
  menu_person: "Quiero hablar con una persona"
  not_sure: "No sé"
  calm:
    - "{Te} entiendo, es normal sentirse así. Estoy {contigo}: vamos paso a paso, y reviso cada cosa antes de dar{te} una respuesta."
    - "Entiendo que esto {te} preocupa. Lo estamos revisando juntos, y cada paso queda registrado."
    - "Gracias por {tu} paciencia; sé que esto no es fácil. Sigamos juntos, un paso a la vez."
  empathy: "Entiendo, revisaremos juntos el cargo que no {reconoces} y {te} preocupa."
  lost_card_empathy: "Lamento mucho lo que pasó. Lo primero es proteger {tu} dinero; después revisamos juntos {tus} movimientos."
  lost_card_block: "¿Bloqueo ahora la tarjeta {card}? Así nadie más puede usarla."
  lost_card_block_on_request: "¿{Quieres} que bloquee ahora la tarjeta {card}? Es decisión {tuya}: solo la bloqueo si me {dices} «sí»."
  lost_card_no_movements: "No veo compras recientes con {tus} tarjetas. Para proteger{te} cuanto antes, paso la conversación a una persona de nuestro equipo de fraudes ahora mismo."
  choose_card: "¿Cuál de {tus} tarjetas fue la que {perdiste} o {te} robaron?"
  review_movements: "Ahora revisemos juntos {tus} movimientos recientes, para que no se nos escape nada. {Marca} los que no {reconoces}; si son todos {tuyos}, {escribe} «todos»."
  recognized_all: "Entendido: {reconoces} todos esos movimientos, así que no hace falta abrir un reclamo. Si me equivoqué y hay alguno que no {reconoces}, {dimelo} y lo revisamos."
  ask_detail:
    - "No encontré ese cargo en los últimos días. Para buscarlo mejor, ¿me {dices} el monto aproximado, el comercio o la fecha?"
    - "Todavía no lo encuentro. Con el monto, el comercio o la fecha, aunque sean aproximados, lo busco de nuevo."
    - "Perdón, no logro encontrarlo con lo que tengo. ¿Me {dices} al menos el monto o la fecha?"
  ask_detail_amount: "No encontré un cargo por ese monto en los últimos días. ¿Me {dices} el comercio o la fecha, así lo busco mejor?"
  choose_charge:
    - "Encontré estos cargos. ¿Cuál {quieres} que revisemos? {Elige} o {escribe} el número."
    - "¿Cuál de estos cargos {quieres} revisar? {Puedes} tocarlo en la lista o escribir su número."
    - "Para seguir necesito saber cuál de estos cargos revisamos. {Elige} uno de la lista, por favor."
  not_a_person: "No, soy VERA, una asistente de inteligencia artificial de LATAM Bank. {Puedes} pedir hablar con una persona cuando {quieras}."
  offer_person: "¿{Quieres} que {te} pase con una persona?"
  named_not_found: "No encontré un cargo con ese nombre, pero estos son {tus} cargos de los últimos días. ¿Alguno es el que {quieres} revisar? {Elige} o {escribe} el número."
  receipt: "{merchant} · {amount} · {date} · {status}"
  unnamed_purchase: "Compra"
  unnamed_bank_adjustment: "Ajuste del banco"
  charge_named: "el cargo de {merchant} por {amount} del {date} a las {time}"
  charge_purchase: "la compra por {amount} del {date} a las {time}"
  charge_bank_adjustment: "el ajuste del banco por {amount} del {date} a las {time}"
  clarify_chosen: "Gracias. Revisemos {charge}."
  clarify_found: "Encontré {charge}."
  status_pending: "Ese cargo todavía está pendiente: no es un cobro firme y puede cambiar o desaparecer en los próximos días."
  status_declined: "Ese intento fue rechazado, así que no se {te} cobró."
  status_reversed: "Ese cargo fue revertido: el dinero ya volvió a {tu} cuenta."
  known_merchant: "Un dato que puede ayudar{te}: en {tu} cuenta hay compras anteriores en ese comercio."
  ask_is_this_charge: "¿Es este el cobro que no corresponde?"
  ask_recognize: "Con esto, ¿lo {reconoces}?"
  ask_recognize_hint: "A veces un comercio aparece en el resumen con otro nombre, o es una suscripción que se renueva sola. ¿Lo {reconoces} ahora?"
  ask_recognize_again: "Perdón, no {te} entendí bien: ¿{reconoces} ese cargo?"
  recognized: "Qué bueno que se aclaró. Entonces no hace falta abrir un reclamo."
  ask_channel: "Entendido. Con un par de preguntas armamos {tu} caso. ¿{Sabes} si ese cargo fue de una compra por internet?"
  ask_card: "¿{Tienes} la tarjeta {contigo}?"
  sweep: "También revisé los demás movimientos de esa tarjeta desde ese día, para que no se nos escape nada. {Marca} los que no {reconoces}; si son todos {tuyos}, {escribe} «todos»."
  offer_block: "Por seguridad, {te} recomiendo bloquear la tarjeta {card}, así nadie más puede usarla. ¿La bloqueo ahora?"
  block_on_request: "No hace falta bloquear la tarjeta para seguir con el reclamo. ¿{Quieres} bloquearla igual, por seguridad?"
  block_done: "Listo, la tarjeta {card} ya está bloqueada; lo confirmé en el sistema."
  block_skipped: "De acuerdo, la tarjeta sigue activa. {Puedes} pedir el bloqueo cuando {quieras}."
  confirm_register_one: "¿Registro {tu} reclamo por {exposure}?"
  confirm_register: "¿Registro un solo reclamo con los {charges}, por {exposure} en total?"
  register_skipped: "De acuerdo, no registro el reclamo. Si más adelante {quieres} hacerlo, {dimelo}."
  case_registered: "Listo, {tu} reclamo quedó registrado con el número {case_id} y ya confirmé en el sistema que está guardado."
  deadline_CO-R15: "Por ley, LATAM Bank debe responder{te} a más tardar el {date} (Ley 1755 de 2015, art. 14)."
  deadline_AR-R03: "Por norma del BCRA, LATAM Bank debe resolver {tu} reclamo a más tardar el {date} (BCRA, protección de usuarios, punto 3.1.6)."
  deadline_AR-R05_ack: "Por ley, LATAM Bank debe confirmar que recibió {tu} reclamo a más tardar el {date} (Ley 25.065, art. 27)."
  deadline_AR-R05_answer: "Y debe corregir el resumen o explicarlo con comprobantes a más tardar el {date} (Ley 25.065, art. 27)."
  route_without_date: "{route}: queda registrada en {tu} caso, y una persona de nuestro equipo {te} confirma la fecha."
  handoff: "Una persona de nuestro equipo revisará {tu} caso y {te} contactará. No {tienes} que repetir nada: ya tiene todo lo que me {dijiste}."
  offer_before_transfer: "Claro, {te} puedo pasar con una persona de nuestro equipo ahora mismo. Si {prefieres}, antes reviso {tu} caso en un par de minutos, así le llega todo listo. ¿Lo reviso primero?"
  handoff_now: "Con gusto. Paso la conversación a una persona ahora mismo."
  turn_limit: "Para no alargar más esta conversación, paso {tu} caso a una persona ahora mismo. No {tienes} que repetir lo que ya me {dijiste}."
  handoff_unclear: "Para no hacer{te} repetir más, paso la conversación a una persona ahora mismo."
  handoff_pt: "Una persona de nuestro equipo que habla portugués revisará el caso."
  safety: "{Tu} seguridad es lo primero. Si {estas} en riesgo, {llama} a la línea de emergencias de {tu} país. Paso la conversación a una persona ahora mismo."
  out_of_scope: "Eso no lo puedo revisar desde {aqui}; para otras consultas y productos, la app o la banca en línea {te} ayudan mejor."
  out_of_scope_opening:
    - "Eso no lo puedo revisar desde {aqui}; para otras consultas y productos, la app o la banca en línea {te} ayudan mejor. En lo que sí {te} acompaño es en esto:"
    - "Para otras consultas y productos, el mejor camino es la app o la banca en línea. Si {te} pasó alguna de estas cosas, lo revisamos juntos ahora mismo:"
    - "Por {aqui} no tengo acceso a eso, y no quiero hacer{te} perder tiempo. Esto es lo que puedo resolver {contigo}:"
  blocked: "Entiendo lo molesto que es que {te} rechacen un pago o {te} bloqueen la tarjeta. Desde {aqui} no puedo ver el motivo ni desbloquearla; eso lo revisa una persona del equipo de Fraude, que confirma {contigo} que todo esté en orden."
  blocked_attempts: "En los últimos 30 días veo estos intentos rechazados. Ninguno se {te} cobró:"
  blocked_none: "En los últimos 30 días no veo intentos rechazados en {tus} movimientos."
  blocked_offer: "¿{Quieres} que {te} comunique ahora con esa persona?"
  blocked_handoff: "Listo, paso {tu} caso al equipo de Fraude con lo que vimos, y una persona {te} contactará para revisar el bloqueo."
  blocked_declined: "De acuerdo. Si más adelante {quieres} revisarlo con una persona, solo {dimelo}. Mientras tanto, esto es lo que puedo resolver {contigo}:"
  pix: "LATAM Bank no opera Pix. Para reclamar un Pix, {puedes} usar el Mecanismo Especial de Devolución (MED) de {tu} banco en Brasil, hasta 80 días después de la transacción."
  scam: "Lamento mucho lo que pasó; no es {tu} culpa que {te} hayan engañado. Para que nuestro equipo de fraudes {te} ayude cuanto antes, necesito dos datos: cuándo fue la transferencia y por qué medio {te} contactaron."
  scam_handoff: "Gracias por contármelo. Paso {tu} caso a nuestro equipo de fraudes ahora mismo y una persona {te} contactará; no {tienes} que repetir lo que ya me {dijiste}. Quiero ser clara {contigo}: una transferencia no tiene contracargo como una compra con tarjeta, pero el equipo va a revisar qué se puede hacer."
  scam_again: "Para avanzar necesito esos dos datos: ¿cuándo fue la transferencia y por qué medio {te} contactaron?"
  improper: "Gracias por avisarme. Ubiquemos ese cobro para que una persona del equipo de reclamos lo revise y decida si corresponde."
  duplicate: "Gracias por avisarme. Busco las compras de ese comercio para que una persona del equipo de reclamos revise el cobro repetido y decida si corresponde."
  not_found: "No encontré ese movimiento entre los {tuyos}."
  ask_claim_again: "¿Me {cuentas} qué pasó con {tu} tarjeta o {tu} cuenta?"
  back_to_question: "Sigamos con la pregunta anterior."
  low_confidence:
    - "Quiero asegurarme de entender{te} bien para ayudar{te} mejor. ¿Me {cuentas} qué pasó? También {puedes} elegir una opción."
    - "Perdón, no estoy segura de haber entendido. ¿Fue un cargo que no {reconoces}, un cobro que no corresponde o algo con {tu} tarjeta?"
    - "Sigo {aqui} {contigo}. Si {te} resulta más fácil, {elige} la opción que más se parece a lo que pasó."
  rephrase:
    - "Perdón, no {te} entendí bien."
    - "Quiero asegurarme de entender{te}."
    - "Perdón por insistir."
  regulator: "Es {tu} derecho acudir a {venue}. Mientras tanto, paso {tu} caso a una persona de nuestro equipo."
  tool_failure: "Perdón, no pude completar la verificación en el sistema y no quiero dar{te} nada por hecho. Paso {tu} caso a una persona de nuestro equipo."
  repeat_case: "Ese cargo ya está en {tu} reclamo {case_id} y no hace falta abrir otro."
  after_handoff:
    - "{Tu} caso ya está con una persona de nuestro equipo, que tiene todo lo que me {dijiste}. No {tienes} que repetir nada."
    - "Sigo {aqui}. La persona que toma {tu} caso ya tiene toda la información y {te} contactará por los canales del banco."
    - "Ya dejé todo listo para la persona que toma {tu} caso. Si algo cambia, como un nuevo cargo, {cuentame} y lo sumo a la conversación."
  after_done:
    - "¿Hay algo más en lo que pueda ayudar{te}? Si es otro tema, {elige} una opción."
    - "{Aqui} sigo por si {necesitas} algo más. {Puedes} elegir una de estas opciones."
    - "Si apareció otro cargo o algo más, {cuentame} y lo revisamos juntos."
  closing: "Un consejo para cuidar {tu} tarjeta: {activa} las alertas de compra en la app, no {compartas} códigos con nadie y {revisa} {tus} movimientos cada semana. Si {necesitas} algo más, {aqui} estoy, y {puedes} pedir hablar con una persona cuando {quieras}."
  confirm_options: "Perdón, no {te} entendí. Para seguir necesito un «sí» o un «no»."
