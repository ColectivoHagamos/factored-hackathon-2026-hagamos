# Customer-facing replies in Spanish. Plain language, one question per turn, no promises, no blame.
# {placeholders} in braces are filled by code; register words change with the variant: tu (MX), usted (CO), vos (AR).
register:
  es-MX: {puedes: puedes, tienes: tienes, quieres: quieres, reconoces: reconoces, confirmas: confirmas, cuentas: cuentas, dices: dices, tu: tu, te: te, contigo: contigo, usa: usa, elige: elige, escribe: escribe, has: has, sabes: sabes, estas: estás, dijiste: dijiste, tuyos: tuyos, llama: llama, activa: activa, compartas: compartas, revisa: revisa, quieras: quieras}
  es-CO: {puedes: puede, tienes: tiene, quieres: quiere, reconoces: reconoce, confirmas: confirma, cuentas: cuenta, dices: dice, tu: su, te: le, contigo: con usted, usa: use, elige: elija, escribe: escriba, has: ha, sabes: sabe, estas: está, dijiste: dijo, tuyos: suyos, llama: llame, activa: active, compartas: comparta, revisa: revise, quieras: quiera}
  es-AR: {puedes: podés, tienes: tenés, quieres: querés, reconoces: reconocés, confirmas: confirmás, cuentas: contás, dices: decís, tu: tu, te: te, contigo: con vos, usa: usá, elige: elegí, escribe: escribí, has: has, sabes: sabés, estas: estás, dijiste: dijiste, tuyos: tuyos, llama: llamá, activa: activá, compartas: compartas, revisa: revisá, quieras: quieras}

templates:
  greeting: "Hola, soy VERA, una asistente de inteligencia artificial de LATAM Bank. {Puedes} pedir hablar con una persona en cualquier momento. ¿Qué pasó con {tu} tarjeta o {tu} cuenta?"
  empathy: "Entiendo que ver un cargo que no {reconoces} preocupa. Vamos a revisarlo juntos."
  ask_detail: "No encontré ese cargo en los últimos días. ¿Me {dices} el monto aproximado, el comercio o la fecha?"
  choose_charge: "Encontré estos cargos. ¿Cuál {quieres} revisar? {Escribe} el número."
  not_a_person: "No, soy VERA, una asistente de inteligencia artificial de LATAM Bank. {Puedes} pedir hablar con una persona cuando {quieras}."
  offer_person: "¿{Quieres} que {te} pase con una persona?"
  named_not_found: "No encontré un cargo con ese nombre. Estos son los cargos de los últimos días: ¿alguno es el que {quieres} revisar? {Escribe} el número."
  receipt: "{date}: {merchant}, {amount}. Estado: {status}."
  unnamed_purchase: "Compra"
  unnamed_bank_adjustment: "Ajuste del banco"
  status_pending: "Ese cargo todavía está pendiente: no es un cobro firme y puede cambiar o desaparecer en los próximos días."
  status_declined: "Ese intento fue rechazado: no se cobró."
  status_reversed: "Ese cargo fue revertido: el dinero ya volvió a la cuenta."
  known_merchant: "Solo como información: hay compras anteriores en ese comercio."
  ask_is_this_charge: "¿Es este el cobro que no corresponde?"
  ask_recognize: "¿Esto aclara {tu} duda? ¿{Reconoces} el cargo ahora?"
  recognized: "Perfecto, entonces no hace falta abrir un reclamo."
  ask_channel: "Para orientar bien el caso: ¿la compra fue por internet?"
  ask_card: "¿{Tienes} la tarjeta {contigo}?"
  sweep: "Revisé los demás movimientos de esa tarjeta desde ese día. ¿{Reconoces} estos? {Escribe} los números que no {reconoces}, o «todos» si los {reconoces}."
  offer_block: "Por seguridad, {te} recomiendo bloquear la tarjeta {card}. ¿{Confirmas} el bloqueo?"
  block_on_request: "La impugnación no exige bloquear la tarjeta. Si {quieres} bloquearla por seguridad, solo {dices} «sí»."
  block_done: "Listo: la tarjeta {card} quedó bloqueada; lo verifiqué en el sistema."
  block_skipped: "De acuerdo, la tarjeta sigue activa. {Puedes} pedir el bloqueo cuando {quieras}."
  confirm_register: "Voy a registrar un solo reclamo con {charges} por {exposure}. ¿{Confirmas}?"
  case_registered: "Registré el reclamo {case_id} y lo verifiqué en el sistema."
  deadline_CO-R15: "El banco debe responder {tu} reclamo a más tardar el {date} (Ley 1755 de 2015, art. 14)."
  deadline_AR-R03: "El banco debe resolver {tu} reclamo a más tardar el {date} (BCRA, protección de usuarios, punto 3.1.6)."
  deadline_AR-R05_ack: "El banco debe acusar recibo de la impugnación a más tardar el {date} (Ley 25.065, art. 27)."
  deadline_AR-R05_answer: "Y debe corregir el resumen o explicarlo con comprobantes a más tardar el {date} (Ley 25.065, art. 27)."
  route_without_date: "{route}: la vía queda registrada; esa fecha la confirma un analista."
  handoff: "Un analista revisará el caso y {te} contactará. No {tienes} que repetir lo que ya me {dijiste}."
  handoff_now: "Con gusto. Paso la conversación a una persona ahora mismo."
  turn_limit: "Para no alargar más esta conversación, paso el caso a una persona ahora mismo. No {tienes} que repetir lo que ya me {dijiste}."
  handoff_unclear: "Para no hacer{te} repetir más, paso la conversación a una persona ahora mismo."
  handoff_pt: "Un analista que habla portugués revisará el caso."
  safety: "Si {estas} en riesgo, {llama} a la línea de emergencias de {tu} país. Paso la conversación a una persona ahora mismo."
  out_of_scope: "Por aquí ayudo con cargos que no {reconoces} y con cobros indebidos. Para consultar el saldo u otros productos, {usa} la app o la banca en línea."
  pix: "LATAM Bank no opera Pix. Para reclamar un Pix, {puedes} usar el Mecanismo Especial de Devolución (MED) de {tu} banco en Brasil, hasta 80 días después de la transacción."
  scam: "Lamento lo que pasó. Para pasar el caso a nuestro equipo de fraudes necesito dos datos: ¿cuándo fue la transferencia y por qué medio {te} contactaron?"
  improper: "Voy a identificar el cobro para que el equipo de reclamos lo revise. Ellos deciden si procede."
  not_found: "No encontré ese movimiento entre los {tuyos}."
  ask_claim_again: "¿Me {cuentas} qué pasó con {tu} tarjeta o {tu} cuenta?"
  back_to_question: "Sigamos con la pregunta anterior."
  low_confidence: "Quiero asegurarme de entender bien. ¿Me {cuentas} qué pasó con el cargo?"
  regulator: "Es {tu} derecho acudir a {venue}. Mientras tanto, paso el caso a un analista."
  tool_failure: "No pude completar la verificación en el sistema, así que no voy a dar nada por hecho. Paso el caso a un analista."
  repeat_case: "Ese cargo ya está en el reclamo {case_id}; no hace falta abrir otro."
  closing: "Para cuidar {tu} tarjeta: {activa} las alertas de compra en la app, no {compartas} códigos y {revisa} los movimientos cada semana. {Puedes} pedir hablar con una persona cuando {quieras}."
  confirm_options: "{Escribe} «sí» o «no»."
