# Customer-facing replies in Spanish, in the voice of the brand: serene, warm and precise, never cold and never
# effusive. Plain language, one question per turn, no promises, no blame. VERA always says it is an AI.
# {placeholders} in braces are filled by code; register words change with the variant: tu (MX), usted (CO), vos (AR).
# A list holds variants of the same reply, so the customer never gets the same words twice in a row.
register:
  es-MX: {puedes: puedes, tienes: tienes, quieres: quieres, reconoces: reconoces, confirmas: confirmas, cuentas: cuentas, dices: dices, tu: tu, tus: tus, te: te, contigo: contigo, usa: usa, elige: elige, escribe: escribe, has: has, sabes: sabes, estas: estás, dijiste: dijiste, tuyos: tuyos, llama: llama, activa: activa, compartas: compartas, revisa: revisa, quieras: quieras, prefieres: prefieres, dimelo: dímelo, cuentame: cuéntame, perdiste: perdiste, marca: marca, necesitas: necesitas, escribeme: escríbeme, tuya: tuya}
  es-CO: {puedes: puede, tienes: tiene, quieres: quiere, reconoces: reconoce, confirmas: confirma, cuentas: cuenta, dices: dice, tu: su, tus: sus, te: le, contigo: con usted, usa: use, elige: elija, escribe: escriba, has: ha, sabes: sabe, estas: está, dijiste: dijo, tuyos: suyos, llama: llame, activa: active, compartas: comparta, revisa: revise, quieras: quiera, prefieres: prefiere, dimelo: dígamelo, cuentame: cuénteme, perdiste: perdió, marca: marque, necesitas: necesita, escribeme: escríbame, tuya: suya}
  es-AR: {puedes: podés, tienes: tenés, quieres: querés, reconoces: reconocés, confirmas: confirmás, cuentas: contás, dices: decís, tu: tu, tus: tus, te: te, contigo: con vos, usa: usá, elige: elegí, escribe: escribí, has: has, sabes: sabés, estas: estás, dijiste: dijiste, tuyos: tuyos, llama: llamá, activa: activá, compartas: compartas, revisa: revisá, quieras: quieras, prefieres: preferís, dimelo: decímelo, cuentame: contame, perdiste: perdiste, marca: marcá, necesitas: necesitás, escribeme: escribime, tuya: tuya}

templates:
  greeting: "Hola{who}, soy VERA, la asistente de inteligencia artificial de LATAM Bank. Estoy aquí para acompañar{te} y resolver esto juntos. ¿Qué pasó con {tu} tarjeta o {tu} cuenta? {Puedes} elegir una opción o contármelo con {tus} palabras; si en algún momento {prefieres} hablar con una persona, solo {dimelo}."
  welcome:
    - "Hola, gracias por escribirme. Soy VERA y {te} acompaño cuando aparece un cargo que no {reconoces}, un cobro que no corresponde, una tarjeta perdida o robada, o una transferencia en la que {te} engañaron. ¿Por dónde empezamos?"
    - "Aquí estoy para ayudar{te}, paso a paso. {Cuentame} con {tus} palabras qué pasó, o {elige} la opción que más se parece."
    - "Sigo {contigo}. Con una de estas opciones lo resolvemos más rápido, o {escribeme} qué pasó y lo vemos juntos."
  menu_unrecognized: "No reconozco un cargo"
  menu_improper: "Me cobraron algo que no corresponde"
  menu_lost_card: "Perdí mi tarjeta o me la robaron"
  menu_scam: "Me engañaron para hacer una transferencia"
  menu_person: "Quiero hablar con una persona"
  not_sure: "No sé"
  empathy: "Entiendo, y lamento el mal rato: ver un cargo que no {reconoces} preocupa. Vamos a revisarlo juntos."
  lost_card_empathy: "Lamento mucho lo que pasó. Lo primero es proteger {tu} dinero; después revisamos juntos {tus} movimientos."
  lost_card_block: "¿Bloqueo ahora la tarjeta {card}? Así nadie más podrá usarla."
  lost_card_block_on_request: "¿{Quieres} que bloquee ahora la tarjeta {card}? Es decisión {tuya}: solo la bloqueo si me {dices} «sí»."
  lost_card_no_movements: "No veo compras recientes con {tus} tarjetas. Para proteger{te} cuanto antes, paso la conversación a una persona de nuestro equipo de fraudes ahora mismo."
  choose_card: "¿Cuál de {tus} tarjetas fue la que {perdiste} o {te} robaron?"
  review_movements: "Ahora revisemos juntos {tus} movimientos recientes, para que no se nos escape nada. {Marca} los que no {reconoces}, o {escribe} «todos» si los {reconoces} todos."
  recognized_all: "Qué bueno: si todos estos movimientos son {tuyos}, no hace falta abrir un reclamo."
  ask_detail: "No encontré ese cargo en los últimos días. Para buscarlo mejor, ¿me {dices} el monto aproximado, el comercio o la fecha?"
  choose_charge: "Encontré estos cargos. ¿Cuál {quieres} que revisemos? {Elige} uno o {escribe} el número."
  not_a_person: "No, soy VERA, una asistente de inteligencia artificial de LATAM Bank. {Puedes} pedir hablar con una persona cuando {quieras}."
  offer_person: "¿{Quieres} que {te} pase con una persona?"
  named_not_found: "No encontré un cargo con ese nombre. Estos son los cargos de los últimos días: ¿alguno es el que {quieres} revisar? {Elige} uno o {escribe} el número."
  receipt: "{date}: {merchant}, {amount}. Estado: {status}."
  unnamed_purchase: "Compra"
  unnamed_bank_adjustment: "Ajuste del banco"
  status_pending: "Ese cargo todavía está pendiente: no es un cobro firme y puede cambiar o desaparecer en los próximos días."
  status_declined: "Ese intento fue rechazado: no se cobró."
  status_reversed: "Ese cargo fue revertido: el dinero ya volvió a la cuenta."
  known_merchant: "Solo como información: hay compras anteriores en ese comercio."
  ask_is_this_charge: "¿Es este el cobro que no corresponde?"
  ask_recognize: "¿Esto aclara {tu} duda? ¿{Reconoces} el cargo ahora?"
  recognized: "Qué bueno que se aclaró: entonces no hace falta abrir un reclamo."
  ask_channel: "Gracias. Para orientar bien el caso: ¿la compra fue por internet?"
  ask_card: "¿{Tienes} la tarjeta {contigo}?"
  sweep: "Ya revisé los demás movimientos de esa tarjeta desde ese día, para que no se nos escape nada. ¿{Reconoces} estos? {Marca} los que no {reconoces}, o {escribe} «todos» si los {reconoces}."
  offer_block: "Por seguridad, {te} recomiendo bloquear la tarjeta {card}; así nadie más podrá usarla. ¿{Confirmas} el bloqueo?"
  block_on_request: "La impugnación no exige bloquear la tarjeta. Si {quieres} bloquearla por seguridad, solo {dices} «sí»."
  block_done: "Listo: la tarjeta {card} quedó bloqueada; lo verifiqué en el sistema."
  block_skipped: "De acuerdo, la tarjeta sigue activa. {Puedes} pedir el bloqueo cuando {quieras}."
  confirm_register: "Voy a registrar un solo reclamo con {charges} por {exposure}. ¿{Confirmas}?"
  case_registered: "Listo, registré el reclamo {case_id} y lo verifiqué en el sistema."
  deadline_CO-R15: "El banco debe responder {tu} reclamo a más tardar el {date} (Ley 1755 de 2015, art. 14)."
  deadline_AR-R03: "El banco debe resolver {tu} reclamo a más tardar el {date} (BCRA, protección de usuarios, punto 3.1.6)."
  deadline_AR-R05_ack: "El banco debe acusar recibo de la impugnación a más tardar el {date} (Ley 25.065, art. 27)."
  deadline_AR-R05_answer: "Y debe corregir el resumen o explicarlo con comprobantes a más tardar el {date} (Ley 25.065, art. 27)."
  route_without_date: "{route}: la vía queda registrada; esa fecha la confirma un analista."
  handoff: "Un analista revisará el caso y {te} contactará. No {tienes} que repetir nada: ya tiene todo lo que me {dijiste}."
  offer_before_transfer: "{Te} puedo conectar con un analista ahora mismo. Si {quieres}, antes reviso {tu} caso: toma un par de minutos. ¿Lo reviso primero?"
  handoff_now: "Con gusto. Paso la conversación a una persona ahora mismo."
  turn_limit: "Para no alargar más esta conversación, paso el caso a una persona ahora mismo. No {tienes} que repetir lo que ya me {dijiste}."
  handoff_unclear: "Para no hacer{te} repetir más, paso la conversación a una persona ahora mismo."
  handoff_pt: "Un analista que habla portugués revisará el caso."
  safety: "Si {estas} en riesgo, {llama} a la línea de emergencias de {tu} país. Paso la conversación a una persona ahora mismo."
  out_of_scope: "Eso no lo puedo ver desde aquí: para {tu} saldo u otros productos, {usa} la app o la banca en línea."
  out_of_scope_opening:
    - "Eso no lo puedo ver desde aquí: para {tu} saldo u otros productos, la app o la banca en línea {te} ayudan mejor. En lo que sí {te} acompaño es en esto:"
    - "Para el saldo y otros productos, el mejor camino es la app o la banca en línea. Si {te} pasó alguna de estas cosas, lo revisamos juntos ahora mismo:"
    - "Por aquí no tengo acceso a eso, y no quiero hacer{te} perder tiempo. Esto es lo que puedo resolver contigo:"
  pix: "LATAM Bank no opera Pix. Para reclamar un Pix, {puedes} usar el Mecanismo Especial de Devolución (MED) de {tu} banco en Brasil, hasta 80 días después de la transacción."
  scam: "Lamento mucho lo que pasó; no es {tu} culpa que alguien {te} engañe. Para pasar el caso a nuestro equipo de fraudes necesito dos datos: ¿cuándo fue la transferencia y por qué medio {te} contactaron?"
  scam_handoff: "Gracias por contármelo. Paso el caso a nuestro equipo de fraudes ahora mismo y un analista {te} contactará; no {tienes} que repetir lo que ya me {dijiste}. Una transferencia no tiene contracargo como una compra con tarjeta: el equipo revisará qué se puede hacer."
  scam_again: "¿Me {dices} cuándo fue la transferencia y por qué medio {te} contactaron?"
  improper: "Gracias por avisarme. Voy a identificar el cobro para que el equipo de reclamos lo revise; ellos deciden si procede."
  not_found: "No encontré ese movimiento entre los {tuyos}."
  ask_claim_again: "¿Me {cuentas} qué pasó con {tu} tarjeta o {tu} cuenta?"
  back_to_question: "Sigamos con la pregunta anterior."
  low_confidence:
    - "Quiero asegurarme de entender{te} bien para ayudar{te} mejor. ¿Me {cuentas} qué pasó con el cargo? También {puedes} elegir una opción."
    - "Perdona, no estoy segura de haber entendido. ¿Fue un cargo que no {reconoces}, un cobro que no corresponde o algo con {tu} tarjeta?"
    - "Sigo aquí contigo. Si {te} resulta más fácil, {elige} la opción que más se parece a lo que pasó."
  rephrase:
    - "Para que sea más fácil:"
    - "Lo digo de otra forma:"
    - "Vamos paso a paso:"
  regulator: "Es {tu} derecho acudir a {venue}. Mientras tanto, paso el caso a un analista."
  tool_failure: "No pude completar la verificación en el sistema, así que no voy a dar nada por hecho. Paso el caso a un analista."
  repeat_case: "Ese cargo ya está en el reclamo {case_id}; no hace falta abrir otro."
  closing: "Para cuidar {tu} tarjeta: {activa} las alertas de compra en la app, no {compartas} códigos y {revisa} los movimientos cada semana. Si {necesitas} algo más, aquí estoy, y {puedes} pedir hablar con una persona cuando {quieras}."
  confirm_options: "{Escribe} «sí» o «no»."
