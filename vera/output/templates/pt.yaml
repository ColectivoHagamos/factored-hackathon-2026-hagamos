# Customer-facing replies in Portuguese (você), in the voice of the brand: serene, warm and precise. Same rules as
# Spanish: plain language, one question per turn, no promises, no blame, and VERA always says it is an AI.
# VERA speaks to the person, not about people in general, and never repeats what the customer just said or chose.
# A list holds variants of a reply.
register:
  pt: {}

templates:
  greeting: "Olá{who}, sou a VERA, a assistente de inteligência artificial do LATAM Bank. Estou aqui para acompanhar você. O que aconteceu com o seu cartão ou a sua conta? Você pode escolher uma opção ou me contar com as suas palavras; se em algum momento preferir falar com uma pessoa, é só me dizer."
  welcome:
    - "Olá, obrigada por me escrever. Sou a VERA e acompanho você quando aparece uma cobrança que você não reconhece, uma cobrança indevida, um cartão perdido ou roubado, ou uma transferência em que enganaram você. Por onde começamos?"
    - "Estou aqui para ajudar, passo a passo. Me conte com as suas palavras o que aconteceu, ou escolha a opção que mais se parece."
    - "Continuo com você. Com uma destas opções resolvemos mais rápido, ou me escreva o que aconteceu e vemos juntos."
  menu_unrecognized: "Não reconheço uma cobrança"
  menu_improper: "Cobraram algo indevido"
  menu_lost_card: "Perdi meu cartão ou fui roubado"
  menu_scam: "Me enganaram numa transferência"
  menu_person: "Quero falar com uma pessoa"
  not_sure: "Não sei"
  calm:
    - "Entendo você, é normal se sentir assim. Estou com você: vamos passo a passo, e eu confiro cada coisa antes de dar uma resposta."
    - "Entendo que isso preocupa você. Estamos verificando juntos, e cada passo fica registrado."
    - "Obrigada pela sua paciência; sei que isso não é fácil. Vamos juntos, um passo de cada vez."
  empathy: "Entendo a sua preocupação. Vamos verificar juntos a cobrança que você não reconhece."
  lost_card_empathy: "Sinto muito pelo que aconteceu. O primeiro passo é proteger o seu dinheiro; depois verificamos juntos os seus movimentos."
  lost_card_block: "Bloqueio agora o cartão {card}? Assim ninguém mais consegue usá-lo."
  lost_card_block_on_request: "Você quer que eu bloqueie agora o cartão {card}? A decisão é sua: só bloqueio se você me disser «sim»."
  lost_card_no_movements: "Não vejo compras recentes nos seus cartões. Para proteger você o quanto antes, vou passar a conversa para uma pessoa da nossa equipe de fraudes agora mesmo."
  choose_card: "Qual dos seus cartões você perdeu ou foi roubado?"
  review_movements: "Agora vamos verificar juntos os seus movimentos recentes, para que nada escape. Marque os que você não reconhece; se todos forem seus, escreva «todos»."
  recognized_all: "Entendi: você reconhece todos esses movimentos, então não é preciso abrir uma reclamação. Se eu entendi errado e algum não for seu, me diga e verificamos."
  ask_detail:
    - "Não encontrei essa cobrança nos últimos dias. Para procurar melhor, pode me dizer o valor aproximado, o estabelecimento ou a data?"
    - "Ainda não a encontrei. Com o valor, o estabelecimento ou a data, mesmo aproximados, eu procuro de novo."
    - "Desculpe, não consigo encontrá-la com o que tenho. Pode me dizer pelo menos o valor ou a data?"
  ask_detail_amount: "Não encontrei uma cobrança nesse valor nos últimos dias. Pode me dizer o estabelecimento ou a data, para eu procurar melhor?"
  choose_charge:
    - "Encontrei estas cobranças. Qual você quer que verifiquemos? Escolha ou escreva o número."
    - "Qual destas cobranças você quer verificar? Você pode tocar nela na lista ou escrever o número."
    - "Para continuar, preciso saber qual destas cobranças verificamos. Escolha uma da lista, por favor."
  not_a_person: "Não, sou a VERA, uma assistente de inteligência artificial do LATAM Bank. Você pode pedir para falar com uma pessoa quando quiser."
  offer_person: "Você quer que eu passe a conversa para uma pessoa?"
  named_not_found: "Não encontrei uma cobrança com esse nome, mas estas são as suas cobranças dos últimos dias. Alguma é a que você quer verificar? Escolha ou escreva o número."
  receipt: "{merchant} · {amount} · {date} · {status}"
  unnamed_purchase: "Compra"
  unnamed_bank_adjustment: "Ajuste do banco"
  charge_named: "a cobrança de {merchant} no valor de {amount}, em {date}, às {time}"
  charge_purchase: "a compra no valor de {amount}, em {date}, às {time}"
  charge_bank_adjustment: "o ajuste do banco no valor de {amount}, em {date}, às {time}"
  clarify_chosen: "Obrigada. Vamos verificar {charge}."
  clarify_found: "Encontrei {charge}."
  status_pending: "Essa cobrança ainda está pendente: não é definitiva e pode mudar ou desaparecer nos próximos dias."
  status_declined: "Essa tentativa foi recusada, então nada foi cobrado de você."
  status_reversed: "Essa cobrança foi estornada: o dinheiro já voltou para a sua conta."
  known_merchant: "Uma informação que pode ajudar: na sua conta há compras anteriores nesse estabelecimento."
  ask_is_this_charge: "É esta a cobrança que não procede?"
  ask_recognize: "Com essa informação, você reconhece a cobrança?"
  ask_recognize_hint: "Às vezes um estabelecimento aparece na fatura com outro nome, ou é uma assinatura que se renova sozinha. Você reconhece a cobrança agora?"
  ask_recognize_again: "Desculpe, não entendi bem: você reconhece essa cobrança?"
  recognized: "Que bom que ficou claro. Então não é preciso abrir uma reclamação."
  ask_channel: "Entendi. Com duas perguntas montamos o seu caso. Você sabe se essa cobrança foi de uma compra pela internet?"
  ask_card: "O cartão está com você?"
  sweep: "Também verifiquei os outros movimentos desse cartão desde aquele dia, para que nada escape. Marque os que você não reconhece; se todos forem seus, escreva «todos»."
  offer_block: "Por segurança, recomendo bloquear o cartão {card}, assim ninguém mais consegue usá-lo. Bloqueio agora?"
  block_on_request: "Não é preciso bloquear o cartão para seguir com a reclamação. Você quer bloqueá-lo mesmo assim, por segurança?"
  block_done: "Pronto, o cartão {card} já está bloqueado; confirmei no sistema."
  block_skipped: "Combinado, o cartão continua ativo. Você pode pedir o bloqueio quando quiser."
  confirm_register_one: "Registro a sua reclamação no valor de {exposure}?"
  confirm_register: "Registro uma única reclamação com as {charges}, no total de {exposure}?"
  register_skipped: "Combinado, não registro a reclamação. Se depois quiser fazer isso, é só me dizer."
  case_registered: "Pronto, a sua reclamação foi registrada com o número {case_id} e já confirmei no sistema que ela está salva."
  deadline_CO-R15: "Por lei, o LATAM Bank deve responder a você até {date} (Lei 1755 de 2015, art. 14)."
  deadline_AR-R03: "Pela norma do BCRA, o LATAM Bank deve resolver a sua reclamação até {date} (BCRA, proteção de usuários, ponto 3.1.6)."
  deadline_AR-R05_ack: "Por lei, o LATAM Bank deve confirmar que recebeu a sua reclamação até {date} (Lei 25.065, art. 27)."
  deadline_AR-R05_answer: "E deve corrigir a fatura ou explicá-la com comprovantes até {date} (Lei 25.065, art. 27)."
  route_without_date: "{route}: fica registrada no seu caso, e a data será confirmada por uma pessoa da nossa equipe."
  handoff: "Uma pessoa da nossa equipe vai revisar o seu caso e entrar em contato com você. Você não precisa repetir nada: ela já tem tudo o que você me contou."
  offer_before_transfer: "Claro, posso passar você para uma pessoa da nossa equipe agora mesmo. Se preferir, antes eu verifico o seu caso em alguns minutos, assim tudo chega pronto. Verifico primeiro?"
  handoff_now: "Claro. Vou transferir a conversa para uma pessoa agora mesmo."
  turn_limit: "Para não alongar mais esta conversa, vou passar o seu caso para uma pessoa agora mesmo. Você não precisa repetir o que já me contou."
  handoff_unclear: "Para não fazer você repetir mais, vou passar a conversa para uma pessoa agora mesmo."
  handoff_pt: "Uma pessoa da nossa equipe que fala português vai revisar o caso."
  safety: "A sua segurança vem primeiro. Se você estiver em risco, ligue para o número de emergência do seu país. Vou transferir a conversa para uma pessoa agora mesmo."
  out_of_scope: "Isso eu não consigo verificar por aqui; para outras consultas e produtos, o app ou o internet banking ajudam melhor."
  out_of_scope_opening:
    - "Isso eu não consigo verificar por aqui; para outras consultas e produtos, o app ou o internet banking ajudam melhor. Onde eu acompanho você é nisto:"
    - "Para outras consultas e produtos, o melhor caminho é o app ou o internet banking. Se aconteceu alguma destas coisas com você, verificamos juntos agora mesmo:"
    - "Por aqui não tenho acesso a isso, e não quero fazer você perder tempo. Isto é o que posso resolver com você:"
  blocked: "Entendo o incômodo de ter um pagamento recusado ou o cartão bloqueado. Daqui eu não consigo ver o motivo nem desbloqueá-lo; quem revisa é uma pessoa da equipe de Fraude, que confirma com você que está tudo certo."
  blocked_attempts: "Nos últimos 30 dias, vejo estas tentativas recusadas. Nenhuma foi cobrada de você:"
  blocked_none: "Nos últimos 30 dias, não vejo tentativas recusadas nas suas movimentações."
  blocked_offer: "Quer que eu coloque você em contato com essa pessoa agora?"
  blocked_handoff: "Pronto, passo o seu caso para a equipe de Fraude com o que vimos, e uma pessoa vai entrar em contato para revisar o bloqueio."
  blocked_declined: "Tudo bem. Se depois quiser revisar com uma pessoa, é só me dizer. Enquanto isso, isto é o que posso resolver com você:"
  pix: "O LATAM Bank não opera Pix. Para contestar um Pix, você pode usar o Mecanismo Especial de Devolução (MED) do seu banco no Brasil, em até 80 dias após a transação."
  scam: "Sinto muito pelo que aconteceu; não é culpa sua terem enganado você. Para a nossa equipe de fraudes ajudar você o quanto antes, preciso de dois dados: quando foi a transferência e por qual meio entraram em contato com você."
  scam_handoff: "Obrigada por me contar. Vou passar o seu caso para a nossa equipe de fraudes agora mesmo, e uma pessoa vai entrar em contato com você; você não precisa repetir o que já me contou. Quero ser clara com você: uma transferência não tem estorno como uma compra com cartão, mas a equipe vai analisar o que pode ser feito."
  scam_again: "Para avançar, preciso desses dois dados: quando foi a transferência e por qual meio entraram em contato com você?"
  improper: "Obrigada por avisar. Vamos localizar essa cobrança para que uma pessoa da equipe de reclamações a analise e decida se procede."
  duplicate: "Obrigada por avisar. Procuro as compras desse estabelecimento para que uma pessoa da equipe de reclamações analise a cobrança repetida e decida se procede."
  not_found: "Não encontrei esse movimento entre os seus."
  ask_claim_again: "Pode me contar o que aconteceu com o seu cartão ou a sua conta?"
  back_to_question: "Vamos voltar à pergunta anterior."
  low_confidence:
    - "Quero ter certeza de que entendi bem para ajudar melhor. Pode me contar o que aconteceu? Você também pode escolher uma opção."
    - "Desculpe, não tenho certeza de ter entendido. Foi uma cobrança que você não reconhece, uma cobrança indevida ou algo com o seu cartão?"
    - "Continuo aqui com você. Se for mais fácil, escolha a opção que mais se parece com o que aconteceu."
  rephrase:
    - "Desculpe, não entendi bem."
    - "Quero ter certeza de que entendi."
    - "Desculpe insistir."
  regulator: "É seu direito recorrer a {venue}. Enquanto isso, vou passar o seu caso para uma pessoa da nossa equipe."
  tool_failure: "Desculpe, não consegui concluir a verificação no sistema e não quero dar nada como certo. Vou passar o seu caso para uma pessoa da nossa equipe."
  repeat_case: "Essa cobrança já está na sua reclamação {case_id} e não é preciso abrir outra."
  after_handoff:
    - "O seu caso já está com uma pessoa da nossa equipe, que tem tudo o que você me contou. Você não precisa repetir nada."
    - "Continuo aqui. A pessoa que assume o seu caso já tem todas as informações e vai entrar em contato pelos canais do banco."
    - "Já deixei tudo pronto para a pessoa que assume o seu caso. Se algo mudar, como uma nova cobrança, me conte e eu acrescento à conversa."
  after_done:
    - "Posso ajudar com mais alguma coisa? Se for outro assunto, escolha uma opção."
    - "Continuo aqui se você precisar de algo mais. Você pode escolher uma destas opções."
    - "Se apareceu outra cobrança ou algo mais, me conte e verificamos juntos."
  closing: "Uma dica para proteger o seu cartão: ative os alertas de compra no app, não compartilhe códigos com ninguém e confira os seus movimentos toda semana. Se precisar de algo mais, estou aqui, e você pode pedir para falar com uma pessoa quando quiser."
  confirm_options: "Desculpe, não entendi. Para continuar, preciso de um «sim» ou um «não»."
