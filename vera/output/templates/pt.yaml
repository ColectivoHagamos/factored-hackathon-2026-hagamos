# Customer-facing replies in Portuguese (você), in the voice of the brand: serene, warm and precise. Same rules as
# Spanish: plain language, no promises, no blame, and VERA always says it is an AI. A list holds variants of a reply.
register:
  pt: {}

templates:
  greeting: "Olá{who}, sou a VERA, a assistente de inteligência artificial do LATAM Bank. Estou aqui para acompanhar você e resolver isso juntos. O que aconteceu com o seu cartão ou a sua conta? Você pode escolher uma opção ou me contar com as suas palavras; se em algum momento preferir falar com uma pessoa, é só me dizer."
  welcome:
    - "Olá, obrigada por me escrever. Sou a VERA e acompanho você quando aparece uma cobrança que você não reconhece, uma cobrança indevida, um cartão perdido ou roubado, ou uma transferência em que enganaram você. Por onde começamos?"
    - "Estou aqui para ajudar, passo a passo. Me conte com as suas palavras o que aconteceu, ou escolha a opção que mais se parece."
    - "Continuo com você. Com uma destas opções resolvemos mais rápido, ou me escreva o que aconteceu e vemos juntos."
  menu_unrecognized: "Não reconheço uma cobrança"
  menu_improper: "Cobraram algo indevido"
  menu_lost_card: "Perdi meu cartão ou fui roubado"
  menu_scam: "Me enganaram numa transferência"
  menu_person: "Quero falar com uma pessoa"
  not_sure: "Não sei"
  empathy: "Entendo, e sinto muito pelo susto: ver uma cobrança que você não reconhece preocupa. Vamos verificar juntos."
  lost_card_empathy: "Sinto muito pelo que aconteceu. O primeiro passo é proteger o seu dinheiro; depois verificamos juntos os seus movimentos."
  lost_card_block: "Bloqueio agora o cartão {card}? Assim ninguém mais poderá usá-lo."
  lost_card_block_on_request: "Você quer que eu bloqueie agora o cartão {card}? A decisão é sua: só bloqueio se você me disser «sim»."
  lost_card_no_movements: "Não vejo compras recentes nos seus cartões. Para proteger você o quanto antes, vou passar a conversa para uma pessoa da nossa equipe de fraudes agora mesmo."
  choose_card: "Qual dos seus cartões você perdeu ou foi roubado?"
  review_movements: "Agora vamos verificar juntos os seus movimentos recentes, para que nada escape. Marque os que você não reconhece, ou escreva «todos» se reconhecer todos."
  recognized_all: "Que bom: se todos esses movimentos são seus, não é preciso abrir uma reclamação."
  ask_detail: "Não encontrei essa cobrança nos últimos dias. Para procurar melhor, pode me dizer o valor aproximado, o estabelecimento ou a data?"
  choose_charge: "Encontrei estas cobranças. Qual você quer que verifiquemos? Escolha uma ou escreva o número."
  not_a_person: "Não, sou a VERA, uma assistente de inteligência artificial do LATAM Bank. Você pode pedir para falar com uma pessoa quando quiser."
  offer_person: "Você quer que eu passe a conversa para uma pessoa?"
  named_not_found: "Não encontrei uma cobrança com esse nome. Estas são as cobranças dos últimos dias: alguma é a que você quer verificar? Escolha uma ou escreva o número."
  receipt: "{date}: {merchant}, {amount}. Situação: {status}."
  unnamed_purchase: "Compra"
  unnamed_bank_adjustment: "Ajuste do banco"
  status_pending: "Essa cobrança ainda está pendente: não é definitiva e pode mudar ou desaparecer nos próximos dias."
  status_declined: "Essa tentativa foi recusada: nada foi cobrado."
  status_reversed: "Essa cobrança foi estornada: o dinheiro já voltou para a conta."
  known_merchant: "Só como informação: há compras anteriores nesse estabelecimento."
  ask_is_this_charge: "É esta a cobrança que não procede?"
  ask_recognize: "Isso esclarece a sua dúvida? Você reconhece a cobrança agora?"
  recognized: "Que bom que ficou claro: então não é preciso abrir uma reclamação."
  ask_channel: "Obrigada. Para orientar bem o caso: a compra foi pela internet?"
  ask_card: "O cartão está com você?"
  sweep: "Já verifiquei os outros movimentos desse cartão desde aquele dia, para que nada escape. Você reconhece estes? Marque os que não reconhece, ou escreva «todos» se reconhecer."
  offer_block: "Por segurança, recomendo bloquear o cartão {card}; assim ninguém mais poderá usá-lo. Você confirma o bloqueio?"
  block_on_request: "A contestação não exige bloquear o cartão. Se quiser bloqueá-lo por segurança, é só dizer «sim»."
  block_done: "Pronto: o cartão {card} foi bloqueado; confirmei no sistema."
  block_skipped: "Combinado, o cartão continua ativo. Você pode pedir o bloqueio quando quiser."
  confirm_register: "Vou registrar uma única reclamação com {charges} no total de {exposure}. Você confirma?"
  case_registered: "Pronto, registrei a reclamação {case_id} e confirmei no sistema."
  deadline_CO-R15: "O banco deve responder à sua reclamação até {date} (Lei 1755 de 2015, art. 14)."
  deadline_AR-R03: "O banco deve resolver a sua reclamação até {date} (BCRA, proteção de usuários, ponto 3.1.6)."
  deadline_AR-R05_ack: "O banco deve confirmar o recebimento da contestação até {date} (Lei 25.065, art. 27)."
  deadline_AR-R05_answer: "E deve corrigir a fatura ou explicá-la com comprovantes até {date} (Lei 25.065, art. 27)."
  route_without_date: "{route}: a via fica registrada; essa data será confirmada por um analista."
  handoff: "Um analista vai revisar o caso e entrar em contato com você. Você não precisa repetir nada: ele já tem tudo o que você me contou."
  offer_before_transfer: "Posso conectar você com um analista agora mesmo. Se quiser, antes eu verifico o seu caso: leva só alguns minutos. Verifico primeiro?"
  handoff_now: "Claro. Vou transferir a conversa para uma pessoa agora mesmo."
  turn_limit: "Para não alongar mais esta conversa, vou passar o caso para uma pessoa agora mesmo. Você não precisa repetir o que já me contou."
  handoff_unclear: "Para não fazer você repetir mais, vou passar a conversa para uma pessoa agora mesmo."
  handoff_pt: "Um analista que fala português vai revisar o caso."
  safety: "Se você estiver em risco, ligue para o número de emergência do seu país. Vou transferir a conversa para uma pessoa agora mesmo."
  out_of_scope: "Isso eu não consigo ver por aqui: para o saldo ou outros produtos, use o app ou o internet banking."
  out_of_scope_opening:
    - "Isso eu não consigo ver por aqui: para o saldo ou outros produtos, o app ou o internet banking ajudam melhor. Onde eu acompanho você é nisto:"
    - "Para o saldo e outros produtos, o melhor caminho é o app ou o internet banking. Se aconteceu alguma destas coisas com você, verificamos juntos agora mesmo:"
    - "Por aqui não tenho acesso a isso, e não quero fazer você perder tempo. Isto é o que posso resolver com você:"
  pix: "O LATAM Bank não opera Pix. Para contestar um Pix, você pode usar o Mecanismo Especial de Devolução (MED) do seu banco no Brasil, em até 80 dias após a transação."
  scam: "Sinto muito pelo que aconteceu; não é culpa sua que alguém tenha enganado você. Para passar o caso à nossa equipe de fraudes, preciso de dois dados: quando foi a transferência e por qual meio entraram em contato com você?"
  scam_handoff: "Obrigada por me contar. Vou passar o caso para a nossa equipe de fraudes agora mesmo, e um analista vai entrar em contato com você; você não precisa repetir o que já me contou. Uma transferência não tem estorno como uma compra com cartão: a equipe vai analisar o que pode ser feito."
  scam_again: "Pode me dizer quando foi a transferência e por qual meio entraram em contato com você?"
  improper: "Obrigada por avisar. Vou identificar a cobrança para que a equipe de reclamações a analise; eles decidem se procede."
  not_found: "Não encontrei esse movimento entre os seus."
  ask_claim_again: "Pode me contar o que aconteceu com o seu cartão ou a sua conta?"
  back_to_question: "Vamos voltar à pergunta anterior."
  low_confidence:
    - "Quero ter certeza de que entendi bem para ajudar melhor. Pode me contar o que aconteceu com a cobrança? Você também pode escolher uma opção."
    - "Desculpe, não tenho certeza de ter entendido. Foi uma cobrança que você não reconhece, uma cobrança indevida ou algo com o seu cartão?"
    - "Continuo aqui com você. Se for mais fácil, escolha a opção que mais se parece com o que aconteceu."
  rephrase:
    - "Para facilitar:"
    - "Vou dizer de outro jeito:"
    - "Vamos passo a passo:"
  regulator: "É seu direito recorrer a {venue}. Enquanto isso, vou passar o caso a um analista."
  tool_failure: "Não consegui concluir a verificação no sistema, então não vou dar nada como feito. Vou passar o caso a um analista."
  repeat_case: "Essa cobrança já está na reclamação {case_id}; não é preciso abrir outra."
  closing: "Para proteger o seu cartão: ative os alertas de compra no app, não compartilhe códigos e confira os movimentos toda semana. Se precisar de algo mais, estou aqui, e você pode pedir para falar com uma pessoa quando quiser."
  confirm_options: "Escreva «sim» ou «não»."
