  <title>VERA · Analyst console</title>

<body>
  <header>

      <h1>VERA · analyst console</h1>

      <form id="lookup" class="row">

          <label for="case">Case id</label>

      </form>
      <p class="note">Demo analyst session; in production the bank's identity provider issues it.</p>
    </section>
    <div id="handoff"></div>
  </main>
