[project]
name = "vera"
version = "0.1.0"
description = "VERA: transaction dispute assistant for LATAM Bank (Factored AI & Data Hackathon 2026, team HAGAMOS)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Team HAGAMOS" }]
# Runtime dependencies are added when a step needs them (contracts, API, data, ML).
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["SKILLS"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
