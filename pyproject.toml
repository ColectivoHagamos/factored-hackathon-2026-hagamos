[project]
name = "vera"
version = "0.1.0"
description = "VERA: asistente de disputas transaccionales de LATAM Bank (Factored AI & Data Hackathon 2026, equipo HAGAMOS)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Equipo HAGAMOS" }]
# Las dependencias de ejecución se agregan cuando un paso las usa (contratos, API, datos, ML).
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["SKILLS"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
