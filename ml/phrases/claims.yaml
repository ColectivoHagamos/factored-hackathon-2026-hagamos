# Claim phrases for the learned classifier (P42), written by the team. No phrase comes from the dataset; balance
# and other out-of-scope questions are our own paraphrases.
#
# Three families share no template, so a phrase never leaks from training into the test:
#   a: complete sentences, a neutral register. Training.
#   b: chat style, short, without accents, typos, voseo. Validation: regularization and threshold.
#   c: other wordings, longer stories and hard cases (a balance word in a fee complaint, "transfer me" to a person).
#      Test only; nothing is fitted or chosen on it.
